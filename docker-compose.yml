services:
  abacus:
    build: .
    ports:
      # Bound to localhost by default — this is a single-user financial app
      # with no auth by default. Remove the "127.0.0.1:" prefix (or put a
      # reverse proxy in front, see docs/deployment.md) to expose it beyond
      # this machine deliberately.
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - abacus-data:/app/data
    environment:
      - PORT=8080
      - DB_PATH=/app/data/abacus.db
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  abacus-data:
