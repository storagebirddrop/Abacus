name: Auto Release

# Fires after every successful CI run on main.
# Only releases user-facing changes: feat and fix commits produce a new tag
# and AppImage. Infrastructure/maintenance prefixes (docs, ci, chore, refactor,
# test, style, perf, build) are skipped — no tag, no release.
#
# Bump rules (conventional commits):
#   feat / feat!  → minor bump  (e.g. v0.3.1 → v0.4.0)
#   fix           → patch bump  (e.g. v0.3.1 → v0.3.2)
#   anything else → skipped
#
# Setup required (one-time):
#   Create a fine-grained Personal Access Token (PAT) with "Contents: Read and write"
#   on this repository, then add it as a repository secret named RELEASE_PAT.
#   Settings → Secrets and variables → Actions → New repository secret → RELEASE_PAT

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  bump-and-tag:
    # Only run when CI actually passed (not on failure or cancellation).
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use the PAT so the pushed tag triggers release.yml.
          token: ${{ secrets.RELEASE_PAT }}
          # Check out the exact commit that passed CI (not whatever HEAD main is now).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type from commit message
        id: bump
        run: |
          MSG=$(git log -1 --format=%s)
          echo "Commit: $MSG"

          # feat / feat! → minor release
          if echo "$MSG" | grep -qE '^feat(\([^)]*\))?[!:]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          # fix → patch release
          elif echo "$MSG" | grep -qE '^fix(\([^)]*\))?[!:]'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          # docs, ci, chore, refactor, test, style, perf, build → no release
          else
            echo "type=skip" >> "$GITHUB_OUTPUT"
            echo "Skipping release for non-user-facing commit: $MSG"
          fi

      - name: Compute next version
        id: version
        if: steps.bump.outputs.type != 'skip'
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST"

          VER=${LATEST#v}
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)

          if [ "${{ steps.bump.outputs.type }}" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: $NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Push new tag
        if: steps.bump.outputs.type != 'skip'
        run: |
          git tag "${{ steps.version.outputs.tag }}" "${{ github.event.workflow_run.head_sha }}"
          git push origin "${{ steps.version.outputs.tag }}"
